<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Sistema de Asistencias</title>
  <meta name="autor" content="Bautista Mendivil, Liz Medina y Leonardo Negri">
  <link rel="icon" href="../img/logoinicialSdAS.png" type="logo">
  <link rel="stylesheet" href="../css/estilos.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>

<body class="fondo-login">
  <div class="auth-contenedor">

    <section class="auth-panel-azul">
      <div class="circulo circulo-1"></div>
      <div class="circulo circulo-2"></div>

      <div class="auth-panel-contenido">
        <img src="../img/logoinicialSdAS.png" alt="Logo E.E.S.T. N.º 5" class="auth-logo">
        <h2>CREAR CUENTA</h2>
        <p class="auth-panel-subtitulo">Sistema de Asistencias</p>
        <p class="auth-panel-texto">
          E.E.S.T. N.º 5 "Gral. Manuel N. Savio" — Completá tus datos para
          solicitar el acceso al sistema de asistencias.
        </p>
      </div>
    </section>

    <section class="auth-panel-blanco">
      <main class="tarjeta-login">
        <h1>Registrarte</h1>
        <p class="subtitulo">Creá tu cuenta para continuar</p>

        <form id="formRegister" autocomplete="off">

          <div class="campo-auth">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" maxlength="40" placeholder="Ingresá tu nombre" required />
          </div>

          <div class="campo-auth">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" maxlength="40" placeholder="Ingresá tu apellido" required />
          </div>

          <div class="campo-auth">
            <label for="dni">DNI</label>
            <input type="text" id="dni" maxlength="8" placeholder="Ingresá tu DNI" required />
          </div>

          <div class="campo-auth">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" maxlength="40" placeholder="Elegí un nombre de usuario" required />
          </div>

          <div class="campo-auth">
            <label for="correo">Correo</label>
            <input type="text" id="correo" maxlength="40" placeholder="Ingresá tu correo" required />
          </div>

          <div class="campo-auth">
            <label for="password">Contraseña</label>
            <div class="input-password-wrapper">
              <input type="password" id="password" maxlength="40" placeholder="Creá una contraseña" required />
              <button type="button" class="boton-mostrar-password" aria-label="Mostrar contraseña">
                <img src="../img/vista.png" alt="">
              </button>
            </div>
          </div>

          <button type="submit" class="Boton-ingresar" id="submit-register">Registrarte</button>
          <button type="button" class="boton-login_register" id="boton-loguear">
            ¿Ya tenés cuenta? <span>Iniciá sesión</span>
          </button>

          <p id="errorRegister" class="mensaje-error" hidden></p>
        </form>
      </main>
    </section>

  </div>

  <script src="../js/mostrarPassword.js"></script>
  <script src="../js/registro.js"></script>
</body>

</html>
