<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso | Sistema de Asistencias</title>
  <meta name="autor" content="Bautista Mendivil, Liz Medina y Leonardo Negri">
  <link rel="icon" href="../img/logoinicialSdAS.png" type="logo">
  <link rel="stylesheet" href="../css/estilos.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>

<body class="fondo-login">
  <div class="auth-contenedor">

    <section class="auth-panel-azul">
      <div class="circulo circulo-1"></div>
      <div class="circulo circulo-2"></div>

      <div class="auth-panel-contenido">
        <img src="../img/logoinicialSdAS.png" alt="Logo E.E.S.T. N.º 5" class="auth-logo">
        <h2>BIENVENIDO</h2>
        <p class="auth-panel-subtitulo">Sistema de Asistencias</p>
        <p class="auth-panel-texto">
          E.E.S.T. N.º 5 "Gral. Manuel N. Savio" — Ingresá con tu usuario y contraseña
          para gestionar la asistencia de los alumnos.
        </p>
      </div>
    </section>

    <section class="auth-panel-blanco">
      <main class="tarjeta-login">
        <h1>Ingresar</h1>
        <p class="subtitulo">Iniciá sesión con tu cuenta</p>

        <form id="formLogin" autocomplete="off">

          <div class="campo-auth">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" maxlength="40" placeholder="Ingresá tu usuario" required />
          </div>

          <div class="campo-auth">
            <label for="password">Contraseña</label>
            <div class="input-password-wrapper">
              <input type="password" id="password" maxlength="40" placeholder="Ingresá tu contraseña" required />
              <button type="button" class="boton-mostrar-password" aria-label="Mostrar contraseña">
                <img src="../img/vista.png" alt="">
              </button>
            </div>
          </div>

          <button class="Boton-ingresar" id="submit-login">Ingresar</button>
          <button type="button" class="boton-login_register" id="recuperar-contrasena"> ¿Te olvidaste la contraseña? <span>Recuperar</span></button>
          <button type="button" class="boton-login_register" id="boton-registrar"> ¿No tenés cuenta? <span>Registrate</span></button>

          <p id="errorLogin" class="mensaje-error" hidden></p>
        </form>
      </main>
    </section>

  </div>

  <script src="../js/mostrarPassword.js"></script>
  <script src="../js/login.js"></script>
</body>

</html>
